<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketFX – Currency Converter with Offline Support</title>
    <meta name="description" content="Convert between 35+ world currencies instantly. Real-time exchange rates from the European Central Bank, cached for offline use. Fast, free, and works without internet." />
    <meta name="keywords" content="currency converter, exchange rates, forex, offline currency converter, PocketFX, GBP, USD, EUR, real-time exchange rates" />
    <meta name="author" content="Joseph Markus" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PocketFX" />
    <meta property="og:title" content="PocketFX – Currency Converter with Offline Support" />
    <meta property="og:description" content="Convert between 35+ world currencies instantly. Real-time exchange rates from the European Central Bank, cached for offline use." />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PocketFX – Currency Converter with Offline Support" />
    <meta name="twitter:description" content="Convert between 35+ world currencies instantly. Real-time exchange rates from the European Central Bank, cached for offline use." />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#010B40" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // Register service worker only in production
      if (
        "serviceWorker" in navigator &&
        window.location.hostname !== "localhost"
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      } else if (
        "serviceWorker" in navigator &&
        window.location.hostname === "localhost"
      ) {
        // Unregister any existing service workers in development
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
      }
    </script>
  </body>
</html>
