<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketFX – Currency Converter with offline support</title>
    <meta
      name="description"
      content="A no-nonsense currency converter built for travel. No ads, no paywalls — just exchange rates cached to your device so they work offline, even without signal."
    />
<meta name="author" content="Joseph Markus" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PocketFX" />
    <meta
      property="og:title"
      content="PocketFX – Currency Converter with offline support"
    />
    <meta
      property="og:description"
      content="A no-nonsense currency converter built for travel. No ads, no paywalls — just exchange rates cached to your device so they work offline, even without signal."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="PocketFX – Currency Converter with offline support"
    />
    <meta
      name="twitter:description"
      content="A no-nonsense currency converter built for travel. No ads, no paywalls — just exchange rates cached to your device so they work offline, even without signal."
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#010B40" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <script>
      // Register service worker only in production
      if (
        "serviceWorker" in navigator &&
        window.location.hostname !== "localhost"
      ) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered: ", registration);
            })
            .catch((registrationError) => {
              console.log("SW registration failed: ", registrationError);
            });
        });
      } else if (
        "serviceWorker" in navigator &&
        window.location.hostname === "localhost"
      ) {
        // Unregister any existing service workers in development
        navigator.serviceWorker
          .getRegistrations()
          .then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
      }
    </script>
  </body>
</html>
